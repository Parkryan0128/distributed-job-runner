name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: runner-test
          POSTGRES_DB: runner_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U runner -d runner_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://runner:runner-test@localhost:5432/runner_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - run: go mod download
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 -v ./...
      - run: go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - name: Build and start the demo
        run: docker compose up --build --wait --wait-timeout 120
      - run: npm run test:acceptance
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Container logs
        if: always()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results
          path: |
            playwright-report/
            test-results/
            compose.log
          retention-days: 7
      - name: Stop demo containers
        if: always()
        run: docker compose down -v
